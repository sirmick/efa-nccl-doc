<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCCL Algorithm Performance Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #30363d;
        }

        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }

        .control-section {
            margin-bottom: 25px;
        }

        .control-section:last-child {
            margin-bottom: 0;
        }

        .control-section h3 {
            color: #58a6ff;
            font-size: 14px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            color: #c9d1d9;
            font-size: 13px;
            margin-bottom: 6px;
        }

        select, input[type="number"] {
            width: 100%;
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
        }

        input[type="number"] {
            font-family: 'Courier New', monospace;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            background: #0d1117;
            border-radius: 4px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .color-indicator {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid #30363d;
        }

        .canvas-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }

        canvas {
            display: block;
            width: 100%;
            background: #0d1117;
            border-radius: 4px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
        }

        .info-card h4 {
            color: #58a6ff;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .info-value {
            font-size: 24px;
            font-weight: 600;
            color: #58a6ff;
            font-family: 'Courier New', monospace;
        }

        .info-label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 5px;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background: #2ea043;
        }

        .formula-display {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #8b949e;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .optimal-badge {
            display: inline-block;
            background: #238636;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: 600;
        }

        .equations-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .equations-panel h3 {
            color: #58a6ff;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
        }

        .equation-item {
            background: #0d1117;
            border-left: 3px solid;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .equation-item:last-child {
            margin-bottom: 0;
        }

        .equation-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .equation-name {
            font-weight: 600;
            color: #c9d1d9;
            font-size: 14px;
        }

        .equation-link {
            color: #58a6ff;
            text-decoration: none;
            font-size: 12px;
            padding: 3px 8px;
            border: 1px solid #30363d;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .equation-link:hover {
            background: #30363d;
        }

        .equation-formula {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #8b949e;
            padding: 8px;
            background: #000000;
            border-radius: 3px;
            overflow-x: auto;
            white-space: pre;
        }

        .equation-params {
            font-size: 11px;
            color: #8b949e;
            margin-top: 6px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NCCL Algorithm Performance Visualizer</h1>
            <p class="subtitle">Theoretical bandwidth analysis based on α-β latency model with configurable hardware parameters</p>
        </header>

        <div class="controls-grid">
            <div class="control-panel">
                <div class="control-section">
                    <h3>Workload Configuration</h3>
                    <div class="control-group">
                        <label for="collective">Collective Operation</label>
                        <select id="collective">
                            <option value="AllReduce">AllReduce</option>
                            <option value="AllGather">AllGather</option>
                            <option value="ReduceScatter">ReduceScatter</option>
                            <option value="Broadcast">Broadcast</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="numNodes">Number of Nodes</label>
                        <input type="number" id="numNodes" value="16" min="1" max="1024">
                    </div>
                    <div class="control-group">
                        <label for="ranksPerNode">Ranks per Node</label>
                        <select id="ranksPerNode">
                            <option value="1">1 GPU per node</option>
                            <option value="8" selected>8 GPUs per node</option>
                        </select>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Hardware Parameters (p5en defaults)</h3>
                    <div class="control-group">
                        <label for="alphaNVLink">α NVLink (μs)</label>
                        <input type="number" id="alphaNVLink" value="1.5" step="0.1">
                    </div>
                    <div class="control-group">
                        <label for="alphaNetwork">α Network/EFA (μs)</label>
                        <input type="number" id="alphaNetwork" value="15" step="0.5">
                    </div>
                    <div class="control-group">
                        <label for="alphaNVLS">α NVLS (μs)</label>
                        <input type="number" id="alphaNVLS" value="2" step="0.1">
                    </div>
                    <div class="control-group">
                        <label for="bwNVLink">NVLink BW per GPU (GB/s)</label>
                        <input type="number" id="bwNVLink" value="600" step="10">
                    </div>
                    <div class="control-group">
                        <label for="bwNetwork">Network BW per GPU (GB/s)</label>
                        <input type="number" id="bwNetwork" value="50" step="1">
                    </div>
                    <div class="control-group">
                        <label for="llOverhead">LL Protocol Overhead</label>
                        <input type="number" id="llOverhead" value="3" step="0.1" min="1">
                    </div>
                    <div class="control-group">
                        <label for="ll128Overhead">LL128 Protocol Overhead</label>
                        <input type="number" id="ll128Overhead" value="1.0625" step="0.01" min="1">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Algorithms to Display</h3>
                    <div class="checkbox-group" id="algorithmCheckboxes"></div>
                </div>

                <button onclick="updateChart()">Update Chart</button>
            </div>

            <div class="canvas-container">
                <canvas id="perfChart" width="1200" height="700"></canvas>
            </div>
        </div>

        <div class="info-grid" id="infoGrid"></div>

        <div class="equations-panel">
            <h3>Algorithm Latency Formulas</h3>
            <div id="equationsDisplay"></div>
        </div>
    </div>

    <script src="algorithm-visualizer.js"></script>
</body>
</html>
